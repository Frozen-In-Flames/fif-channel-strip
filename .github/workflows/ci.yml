name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Offline tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The project has zero dependencies, so there is no install step.
      # These tests cover the offline DSP math and the suite definition.
      # Live AudioContext rendering still needs a browser and is not run here.
      - name: Run offline tests
        run: npm test
